name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - azure-migration
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - azure-migration

jobs:
  build_and_deploy_job:
    if: github.repository == 'GlobalCXOCircle/global-cxo-mother-website' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BAY_0616D3410 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "out" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://backendgcxo-hfdrd8cugtepfpcs.centralus-01.azurewebsites.net/api"
          NEXT_PUBLIC_USE_API_AUTH: "true"
          NEXT_PUBLIC_CALCOM_URL: "https://globalcxocircle.com/cal"
          NEXT_PUBLIC_CALCOM_ADMIN_URL: "https://gcio-calcom-production.up.railway.app"
          NEXT_PUBLIC_CALCOM_IFRAME_SRC: "https://gcio-calcom-production.up.railway.app"

  close_pull_request_job:
    if: github.repository == 'GlobalCXOCircle/global-cxo-mother-website' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BAY_0616D3410 }}
          action: "close"
          app_location: ""

